<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recorder</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        
        #talkButton {
            padding: 20px 40px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .not-talking {
            background-color: #4CAF50;
            color: white;
        }

        .talking {
            background-color: #f44336;
            color: white;
        }

        .playing {
            background-color: #2196F3;
            color: white;
        }

        #status {
            position: fixed;
            top: 20px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="status"></div>
    <button id="talkButton" class="not-talking">Talk</button>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let isTalking = false;
        let silenceTimer = null;
        let audioContext;
        let analyser;
        let silenceThreshold = 0.01;
        let silenceStart = null;
        const silenceDuration = 1000; // 1 second of silence
        let hasSpeechOccurred = false;
        let currentAudio = null;

        const talkButton = document.getElementById('talkButton');
        const statusDiv = document.getElementById('status');

        async function setupRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            source.connect(analyser);
            
            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                statusDiv.textContent = 'Processing audio...';
                
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('audio', audioBlob);

                try {
                    const response = await fetch('/process-audio', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const processedAudio = await response.blob();
                    const audioUrl = URL.createObjectURL(processedAudio);
                    currentAudio = new Audio(audioUrl);
                    
                    statusDiv.textContent = 'Playing audio...';
                    
                    currentAudio.onended = () => {
                        statusDiv.textContent = '';
                        currentAudio = null;
                        // Automatically start recording again after playback
                        if (isTalking) {
                            startRecording();
                        }
                    };
                    
                    if (isTalking) { // Only play if still in talking mode
                        currentAudio.play();
                    } else {
                        statusDiv.textContent = '';
                        currentAudio = null;
                    }
                } catch (error) {
                    console.error('Error processing audio:', error);
                    statusDiv.textContent = 'Error processing audio';
                    setTimeout(() => {
                        statusDiv.textContent = '';
                        // Start recording again even if there was an error
                        if (isTalking) {
                            startRecording();
                        }
                    }, 3000);
                }
            };
        }

        function checkSilence() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
            const normalizedAverage = average / 255;

            if (normalizedAverage >= silenceThreshold) {
                hasSpeechOccurred = true;
                silenceStart = null;
            } else if (hasSpeechOccurred) {
                if (!silenceStart) {
                    silenceStart = Date.now();
                } else if (Date.now() - silenceStart >= silenceDuration) {
                    stopRecording();
                    return;
                }
            }

            if (isRecording) {
                requestAnimationFrame(checkSilence);
            }
        }

        function startRecording() {
            audioChunks = [];
            mediaRecorder.start();
            isRecording = true;
            hasSpeechOccurred = false;
            talkButton.classList.remove('not-talking');
            talkButton.classList.add('talking');
            talkButton.textContent = 'End Talk';
            statusDiv.textContent = 'Recording...';
            checkSilence();
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            silenceStart = null;
        }

        talkButton.addEventListener('click', async () => {
            if (!mediaRecorder) {
                await setupRecording();
            }
            
            if (isTalking) {
                stopRecording();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                talkButton.classList.remove('talking');
                talkButton.classList.add('not-talking');
                talkButton.textContent = 'Talk';
                statusDiv.textContent = '';
            } else {
                startRecording();
            }
            isTalking = !isTalking;
        });
    </script>
</body>
</html>
