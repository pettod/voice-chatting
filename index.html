<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Otherly</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #d4d4d4;
        }
        
        .chat-container {
            background: radial-gradient(circle at center, #a955f768 0%, #000000 70%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.457);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1),
                        inset 0 0 10px rgba(255, 255, 255, 0.05);
            width: 600px;
            max-width: calc(90% - 3rem);
            position: relative;
            padding: 1.5rem;
        }

        h1 {
            text-align: center;
            background: linear-gradient(to right, #c1c1c1, #ffffff, #6d6d6d);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 3.0rem;
            margin-bottom: 2rem;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .button-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #talkButton {
            padding: 16px 32px;
            font-size: clamp(14px, 4vw, 18px);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            width: min(250px, 80%);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .not-talking {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(34, 197, 94, 0.3);
        }

        .talking {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.3);
        }

        .playing {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.3);
        }

        #status {
            font-size: clamp(14px, 3.5vw, 16px);
            color: #cbcbcb;
            font-weight: 500;
            text-align: center;
            width: 100%;
            min-height: 20px;
            display: block;
            transition: opacity 0.4s ease;
        }

        #timer {
            font-size: clamp(14px, 4vw, 16px);
            color: #cbcbcb;
            text-align: center;
            margin-bottom: 6px;
            font-weight: bold;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #timer.active {
            opacity: 1;
        }

        .waveform-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: min(180px, 30vh);
            width: min(180px, 90%);
            opacity: 0;
            transition: all 0.4s ease;
            background: rgba(0, 0, 0, 0.288);
            border-radius: 120px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.246);
            transform: scale(0.95);
        }

        .waveform-container.active {
            opacity: 1;
            transform: scale(1);
        }

        .waveform-container.listening {
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .waveform-bar {
            width: min(8px, 2vw);
            height: 100%;
            background: linear-gradient(180deg, #ffffff, #a9a9a9b0);
            transition: transform 0.2s ease;
        }

        @keyframes wave {
            0%, 100% {
                transform: scaleY(0.1);
            }
            50% {
                transform: scaleY(1);
            }
        }

        #personalityInput {
            width: 90%;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin-bottom: 10px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        #personalityInput:focus {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        #personalityInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <h1>Otherly</h1>
        <div class="chat-container">
            <div class="button-container">
                <input type="text" id="personalityInput" placeholder="Describe behavior" />
                <div class="waveform-container">
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                    <div class="waveform-bar"></div>
                </div>
                <div id="status"></div>
                <div id="timer">00:00</div>
                <button id="talkButton" class="not-talking">Talk</button>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let isTalking = false;
        let silenceTimer = null;
        let audioContext;
        let analyser;
        let silenceThreshold = 9.0; // Standard deviation threshold
        let silenceStart = null;
        const silenceDuration = 1000; // 1 second of silence
        let hasSpeechOccurred = false;
        let currentAudio = null;
        let playbackAnalyser = null;
        let startTime;
        let timerInterval;

        const talkButton = document.getElementById('talkButton');
        const statusDiv = document.getElementById('status');
        const timerDiv = document.getElementById('timer');
        const waveformContainer = document.querySelector('.waveform-container');
        const waveformBars = document.querySelectorAll('.waveform-bar');
        const personalityInput = document.getElementById('personalityInput');

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            timerDiv.textContent = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        async function setupRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512; // Increased FFT size for better frequency resolution
            analyser.smoothingTimeConstant = 0.5; // Added smoothing for more fluid movement
            source.connect(analyser);
            
            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                if (!isTalking) {
                    statusDiv.textContent = '';
                } else {
                    statusDiv.textContent = 'Thinking...';
                }
                waveformContainer.classList.remove('listening');
                
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('audio', audioBlob);
                formData.append('personality', personalityInput.value);

                try {
                    const response = await fetch('/process-audio', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const processedAudio = await response.blob();
                    const audioUrl = URL.createObjectURL(processedAudio);
                    currentAudio = new Audio(audioUrl);
                    
                    // Set up audio analyser for playback
                    const audioSource = audioContext.createMediaElementSource(currentAudio);
                    playbackAnalyser = audioContext.createAnalyser();
                    playbackAnalyser.fftSize = 512;
                    playbackAnalyser.smoothingTimeConstant = 0.5;
                    audioSource.connect(playbackAnalyser);
                    playbackAnalyser.connect(audioContext.destination);
                    
                    statusDiv.textContent = 'Responding...';
                    
                    currentAudio.onended = () => {
                        statusDiv.textContent = '';
                        currentAudio = null;
                        playbackAnalyser = null;
                        // Add a small delay before transitioning to listening state
                        setTimeout(() => {
                            if (isTalking) {
                                waveformContainer.classList.add('listening');
                                startRecording();
                            } else {
                                waveformContainer.classList.remove('active');
                            }
                        }, 200); // Reduced from 400ms to 200ms
                    };
                    
                    if (isTalking) { // Only play if still in talking mode
                        currentAudio.play();
                        updatePlaybackWaveform();
                    } else {
                        statusDiv.textContent = '';
                        currentAudio = null;
                        playbackAnalyser = null;
                        waveformContainer.classList.remove('active');
                    }
                } catch (error) {
                    console.error('Error processing audio:', error);
                    statusDiv.textContent = 'Error processing audio';
                    waveformContainer.classList.remove('active');
                    waveformContainer.classList.remove('listening');
                    setTimeout(() => {
                        statusDiv.textContent = '';
                        // Start recording again even if there was an error
                        if (isTalking) {
                            startRecording();
                        }
                    }, 3000);
                }
            };
        }

        function updateWaveform() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            const barCount = waveformBars.length;
            const step = Math.floor(dataArray.length / barCount);
            
            for(let i = 0; i < barCount; i++) {
                const start = i * step;
                const end = start + step;
                const average = dataArray.slice(start, end).reduce((a, b) => a + b) / step;
                const scale = Math.max(0.1, (average / 255) * 1.5); // Increased scaling factor and reduced min scale
                waveformBars[i].style.transform = `scaleY(${scale})`;
            }

            if (isRecording) {
                requestAnimationFrame(updateWaveform);
            }
        }

        function updatePlaybackWaveform() {
            if (!playbackAnalyser || !currentAudio) return;

            const dataArray = new Uint8Array(playbackAnalyser.frequencyBinCount);
            playbackAnalyser.getByteFrequencyData(dataArray);
            
            const barCount = waveformBars.length;
            const step = Math.floor(dataArray.length / barCount);
            
            for(let i = 0; i < barCount; i++) {
                const start = i * step;
                const end = start + step;
                const average = dataArray.slice(start, end).reduce((a, b) => a + b) / step;
                const scale = Math.max(0.1, (average / 255) * 1.5);
                waveformBars[i].style.transform = `scaleY(${scale})`;
            }

            if (currentAudio && !currentAudio.paused) {
                requestAnimationFrame(updatePlaybackWaveform);
            }
        }

        function checkSilence() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate mean
            const mean = dataArray.reduce((a, b) => a + b) / dataArray.length;
            
            // Calculate standard deviation
            const squareDiffs = dataArray.map(value => {
                const diff = value - mean;
                return diff * diff;
            });
            const avgSquareDiff = squareDiffs.reduce((a, b) => a + b) / squareDiffs.length;
            const stdDev = Math.sqrt(avgSquareDiff);

            if (stdDev >= silenceThreshold) {
                hasSpeechOccurred = true;
                silenceStart = null;
            } else if (hasSpeechOccurred) {
                if (!silenceStart) {
                    silenceStart = Date.now();
                } else if (Date.now() - silenceStart >= silenceDuration) {
                    stopRecording();
                    return;
                }
            }

            if (isRecording) {
                requestAnimationFrame(checkSilence);
            }
        }

        function startRecording() {
            audioChunks = [];
            mediaRecorder.start();
            isRecording = true;
            hasSpeechOccurred = false;
            talkButton.classList.remove('not-talking');
            talkButton.classList.add('talking');
            talkButton.textContent = 'End Talk';
            statusDiv.textContent = 'Listening...';
            waveformContainer.classList.add('active');
            waveformContainer.classList.add('listening');
            timerDiv.classList.add('active');
            checkSilence();
            updateWaveform();
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            silenceStart = null;
            waveformBars.forEach(bar => {
                bar.style.transition = 'transform 0.1s ease';
                bar.style.transform = 'scaleY(0.1)';
            });
        }

        talkButton.addEventListener('click', async () => {
            if (!mediaRecorder) {
                await setupRecording();
            }
            
            if (isTalking) {
                stopRecording();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                    playbackAnalyser = null;
                }
                waveformContainer.classList.remove('active');
                waveformContainer.classList.remove('listening');
                talkButton.classList.remove('talking');
                talkButton.classList.add('not-talking');
                talkButton.textContent = 'Talk';
                statusDiv.textContent = '';
                clearInterval(timerInterval);
                timerDiv.textContent = '00:00';
                timerDiv.classList.remove('active');
            } else {
                startRecording();
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
            }
            isTalking = !isTalking;
        });
    </script>
</body>
</html>
