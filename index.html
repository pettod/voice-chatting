<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recorder</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        
        .button-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #talkButton {
            padding: 20px 40px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            width: 150px; /* Added fixed width */
        }

        .not-talking {
            background-color: #4CAF50;
            color: white;
        }

        .talking {
            background-color: #f44336;
            color: white;
        }

        .playing {
            background-color: #2196F3;
            color: white;
        }

        #status {
            position: fixed;
            top: 20px;
            font-size: 16px;
            color: #666;
        }

        .waveform-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px; /* Increased gap */
            height: 130px; /* Increased height by 30% */
            width: 390px; /* Increased width by 30% */
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .waveform-container.active {
            opacity: 1;
        }

        .waveform-bar {
            width: 8px;
            height: 100%;
            background-color: #2196F3;
            transition: transform 0.05s ease;
        }

        @keyframes wave {
            0%, 100% {
                transform: scaleY(0.1);
            }
            50% {
                transform: scaleY(1);
            }
        }
    </style>
</head>
<body>
    <div id="status"></div>
    <div class="button-container">
        <div class="waveform-container">
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
            <div class="waveform-bar"></div>
        </div>
        <button id="talkButton" class="not-talking">Talk</button>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let isTalking = false;
        let silenceTimer = null;
        let audioContext;
        let analyser;
        let silenceThreshold = 0.01; // Reduced threshold for more sensitivity
        let silenceStart = null;
        const silenceDuration = 1000; // 1 second of silence
        let hasSpeechOccurred = false;
        let currentAudio = null;
        let playbackAnalyser = null;

        const talkButton = document.getElementById('talkButton');
        const statusDiv = document.getElementById('status');
        const waveformContainer = document.querySelector('.waveform-container');
        const waveformBars = document.querySelectorAll('.waveform-bar');

        async function setupRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512; // Increased FFT size for better frequency resolution
            analyser.smoothingTimeConstant = 0.5; // Added smoothing for more fluid movement
            source.connect(analyser);
            
            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                statusDiv.textContent = 'Processing audio...';
                waveformContainer.classList.remove('active');
                
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('audio', audioBlob);

                try {
                    const response = await fetch('/process-audio', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const processedAudio = await response.blob();
                    const audioUrl = URL.createObjectURL(processedAudio);
                    currentAudio = new Audio(audioUrl);
                    
                    // Set up audio analyser for playback
                    const audioSource = audioContext.createMediaElementSource(currentAudio);
                    playbackAnalyser = audioContext.createAnalyser();
                    playbackAnalyser.fftSize = 512;
                    playbackAnalyser.smoothingTimeConstant = 0.5;
                    audioSource.connect(playbackAnalyser);
                    playbackAnalyser.connect(audioContext.destination);
                    
                    statusDiv.textContent = 'Playing audio...';
                    waveformContainer.classList.add('active');
                    
                    currentAudio.onended = () => {
                        statusDiv.textContent = '';
                        currentAudio = null;
                        playbackAnalyser = null;
                        waveformContainer.classList.remove('active');
                        // Automatically start recording again after playback
                        if (isTalking) {
                            startRecording();
                        }
                    };
                    
                    if (isTalking) { // Only play if still in talking mode
                        currentAudio.play();
                        updatePlaybackWaveform();
                    } else {
                        statusDiv.textContent = '';
                        currentAudio = null;
                        playbackAnalyser = null;
                        waveformContainer.classList.remove('active');
                    }
                } catch (error) {
                    console.error('Error processing audio:', error);
                    statusDiv.textContent = 'Error processing audio';
                    waveformContainer.classList.remove('active');
                    setTimeout(() => {
                        statusDiv.textContent = '';
                        // Start recording again even if there was an error
                        if (isTalking) {
                            startRecording();
                        }
                    }, 3000);
                }
            };
        }

        function updateWaveform() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            const barCount = waveformBars.length;
            const step = Math.floor(dataArray.length / barCount);
            
            for(let i = 0; i < barCount; i++) {
                const start = i * step;
                const end = start + step;
                const average = dataArray.slice(start, end).reduce((a, b) => a + b) / step;
                const scale = Math.max(0.1, (average / 255) * 1.5); // Increased scaling factor and reduced min scale
                waveformBars[i].style.transform = `scaleY(${scale})`;
            }

            if (isRecording) {
                requestAnimationFrame(updateWaveform);
            }
        }

        function updatePlaybackWaveform() {
            if (!playbackAnalyser || !currentAudio) return;

            const dataArray = new Uint8Array(playbackAnalyser.frequencyBinCount);
            playbackAnalyser.getByteFrequencyData(dataArray);
            
            const barCount = waveformBars.length;
            const step = Math.floor(dataArray.length / barCount);
            
            for(let i = 0; i < barCount; i++) {
                const start = i * step;
                const end = start + step;
                const average = dataArray.slice(start, end).reduce((a, b) => a + b) / step;
                const scale = Math.max(0.1, (average / 255) * 1.5);
                waveformBars[i].style.transform = `scaleY(${scale})`;
            }

            if (currentAudio && !currentAudio.paused) {
                requestAnimationFrame(updatePlaybackWaveform);
            }
        }

        function checkSilence() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
            const normalizedAverage = average / 255;

            if (normalizedAverage >= silenceThreshold) {
                hasSpeechOccurred = true;
                silenceStart = null;
            } else if (hasSpeechOccurred) {
                if (!silenceStart) {
                    silenceStart = Date.now();
                } else if (Date.now() - silenceStart >= silenceDuration) {
                    stopRecording();
                    return;
                }
            }

            if (isRecording) {
                requestAnimationFrame(checkSilence);
            }
        }

        function startRecording() {
            audioChunks = [];
            mediaRecorder.start();
            isRecording = true;
            hasSpeechOccurred = false;
            talkButton.classList.remove('not-talking');
            talkButton.classList.add('talking');
            talkButton.textContent = 'End Talk';
            statusDiv.textContent = 'Recording...';
            waveformContainer.classList.add('active');
            checkSilence();
            updateWaveform();
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            silenceStart = null;
            waveformBars.forEach(bar => bar.style.transform = 'scaleY(0.1)');
        }

        talkButton.addEventListener('click', async () => {
            if (!mediaRecorder) {
                await setupRecording();
            }
            
            if (isTalking) {
                stopRecording();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                    playbackAnalyser = null;
                    waveformContainer.classList.remove('active');
                }
                talkButton.classList.remove('talking');
                talkButton.classList.add('not-talking');
                talkButton.textContent = 'Talk';
                statusDiv.textContent = '';
            } else {
                startRecording();
            }
            isTalking = !isTalking;
        });
    </script>
</body>
</html>
